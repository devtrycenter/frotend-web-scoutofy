<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Daftar - Scoutify</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#132924",
                        "secondary-container": "#ffca98",
                        "on-secondary-container": "#7a532b",
                        "primary": "#361F1A",
                        "surface-container-low": "#faf2f0",
                        "surface-variant": "#e9e1df",
                        "secondary": "#7d562d",
                        "primary-fixed": "#ffdad3",
                        "surface-container-high": "#eee6e5",
                        "on-secondary-fixed": "#2c1600",
                        "inverse-surface": "#33302f",
                        "tertiary": "#00140f",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1e1b1a",
                        "surface-container-highest": "#e9e1df",
                        "on-surface-variant": "#504442",
                        "on-primary-fixed": "#2b1611",
                        "on-tertiary-container": "#7a918a",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f7efed",
                        "outline-variant": "#d4c3bf",
                        "surface-container": "#f4ecea",
                        "on-tertiary-fixed": "#091f1b",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fff8f6",
                        "on-primary-fixed-variant": "#5c403a",
                        "surface-tint": "#755751",
                        "surface": "#fff8f6",
                        "on-secondary-fixed-variant": "#623f18",
                        "error-container": "#ffdad6",
                        "surface-dim": "#e0d8d7",
                        "primary-fixed-dim": "#e5beb6",
                        "primary-container": "#361f1a",
                        "tertiary-fixed": "#cfe8e0",
                        "secondary-fixed": "#ffdcbe",
                        "on-tertiary-fixed-variant": "#354b45",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#b3ccc4",
                        "outline": "#827471",
                        "inverse-primary": "#e5beb6",
                        "error": "#ba1a1a",
                        "on-surface": "#1e1b1a",
                        "on-primary": "#ffffff",
                        "background": "#fff8f6",
                        "secondary-fixed-dim": "#f0bd8b",
                        "on-primary-container": "#a7847d"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],
                        "body-md": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"],
                    }
                },
            },
        }
    </script>

    <style>
        /* Animasi khusus untuk memunculkan popup */
        .animate-popup {
            animation: popup 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popup {
            0% { transform: scale(0.5) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-surface-container-high/40 text-on-background font-body-md selection:bg-secondary-container min-h-screen flex items-center justify-center p-4 relative overflow-hidden dot-pattern">

    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute top-10 left-10 md:left-32 w-64 h-64 bg-primary-fixed/50 blur-[80px] rounded-full floating"></div>
        <div class="absolute bottom-10 right-10 md:right-32 w-80 h-80 bg-secondary-container/40 blur-[100px] rounded-full floating" style="animation-delay: 1.5s;"></div>
    </div>

    <main class="relative z-10 w-full max-w-md">
        <div class="squishy-card bg-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] text-center border-[6px] border-surface-container-high shadow-[0_30px_60px_rgba(0,0,0,0.15)] animate-popup overflow-hidden">
            
            <div class="absolute -top-6 -right-6 w-24 h-24 bg-tertiary-fixed rounded-full blur-xl opacity-50 pointer-events-none"></div>

            <div class="w-20 h-20 md:w-24 md:h-24 mx-auto bg-primary-fixed rounded-full flex items-center justify-center text-primary mb-6 border-4 border-white shadow-lg floating">
                <span class="material-symbols-outlined text-4xl md:text-5xl">app_promo</span>
            </div>
            
            <h2 class="font-headline-lg text-2xl md:text-3xl font-extrabold text-primary mb-4 tracking-tight drop-shadow-sm">Daftar via Aplikasi</h2>
            
            <p class="text-on-surface-variant font-medium text-base md:text-lg mb-8 leading-relaxed">
                Saat ini, pendaftaran akun baru Scoutify hanya dapat dilakukan melalui aplikasi mobile kami. Yuk, unduh sekarang dan mulai petualanganmu!
            </p>
            
            <div class="flex flex-col gap-4">
                <a href="{{ url_for('landing') }}#download" class="w-full bg-primary text-on-primary py-4 md:py-5 rounded-full font-bold text-lg md:text-xl hover:scale-105 transition-all shadow-[0_10px_20px_rgba(30,10,7,0.2)] border-b-[6px] border-black active:translate-y-1 active:border-b-2 flex items-center justify-center gap-2 group">
                    <span class="material-symbols-outlined group-hover:-translate-y-1 transition-transform">download</span> Unduh Sekarang
                </a>
                
                <a href="{{ url_for('landing') }}" class="text-primary font-bold hover:underline mt-2 inline-flex items-center justify-center gap-1 group transition-colors">
                    <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span> Kembali ke Basecamp
                </a>
            </div>

        </div>
    </main>

</body>
</html>
